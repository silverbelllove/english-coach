<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="영어코치">
<meta name="theme-color" content="#4F46E5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>영어 뼈대 코치</title>
<style>
  :root {
    --primary: #4F46E5; --primary-light: #EEF2FF; --bg: #F8FAFC; --card: #FFFFFF;
    --text: #1E293B; --subtext: #64748B; --line: #E2E8F0; --soft: #F1F5F9;
    --ok-bg: #D1FAE5; --ok: #047857; --err-bg: #FEE2E2; --err: #B91C1C; --warn-bg: #FEF3C7; --warn: #B45309;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #818CF8; --primary-light: #262A4F; --bg: #0F172A; --card: #1E293B;
      --text: #E2E8F0; --subtext: #94A3B8; --line: #334155; --soft: #273449;
      --ok-bg: #064E3B; --ok: #6EE7B7; --err-bg: #4C1D1D; --err: #FCA5A5; --warn-bg: #4A3510; --warn: #FCD34D;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg); color: var(--text); padding-bottom: calc(72px + env(safe-area-inset-bottom)); -webkit-text-size-adjust: 100%; }
  header { background: #4F46E5; color: #fff; padding: calc(env(safe-area-inset-top) + 14px) 16px 12px; position: sticky; top: 0; z-index: 20;
    display: flex; justify-content: space-between; align-items: center; gap: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  header h1 { font-size: 1.1rem; font-weight: 700; }
  header p { font-size: .76rem; opacity: .85; margin-top: 2px; }
  .hbtn { background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.4); color: #fff; padding: 8px 12px; border-radius: 10px; font-size: .78rem; font-weight: 600; white-space: nowrap; }

  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--line); display: flex; z-index: 30; padding-bottom: env(safe-area-inset-bottom); }
  .nav-item { flex: 1; text-align: center; padding: 9px 2px 8px; font-size: .72rem; font-weight: 600; color: var(--subtext); background: none; border: none; }
  .nav-item.active { color: var(--primary); }
  .nav-icon { font-size: 1.15rem; display: block; margin-bottom: 2px; }

  .container { padding: 14px 16px; max-width: 560px; margin: 0 auto; }
  .section { display: none; } .section.active { display: block; }
  .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 1px solid var(--line); }
  .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: .72rem; font-weight: 700; background: var(--primary-light); color: var(--primary); margin-bottom: 8px; }
  .badge.warn { background: var(--warn-bg); color: var(--warn); } .badge.err { background: var(--err-bg); color: var(--err); } .badge.ok { background: var(--ok-bg); color: var(--ok); }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; scrollbar-width: none; }
  .chip { flex: none; padding: 8px 12px; border-radius: 20px; border: 1px solid var(--line); background: var(--card); color: var(--text); font-size: .8rem; font-weight: 600; }
  .chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .progress { font-size: .78rem; color: var(--subtext); margin: 0 2px 10px; }

  .q-title { font-size: 1.02rem; font-weight: 700; margin-bottom: 6px; line-height: 1.45; }
  .q-hint { font-size: .82rem; color: var(--subtext); margin-bottom: 10px; line-height: 1.5; }
  .bone { background: var(--soft); border-left: 4px solid var(--primary); padding: 9px 12px; font-size: .83rem; margin-bottom: 12px; border-radius: 0 8px 8px 0; }
  input[type=text], textarea { width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 10px; font-size: 16px; margin-bottom: 10px; outline: none; background: var(--card); color: var(--text); font-family: inherit; }
  input[type=text]:focus, textarea:focus { border-color: var(--primary); }
  textarea { min-height: 130px; font-size: 13px; font-family: ui-monospace, Menlo, monospace; }
  .row { display: flex; gap: 8px; }
  .btn { flex: 1; padding: 11px; border: none; border-radius: 10px; font-size: .88rem; font-weight: 600; background: var(--primary); color: #fff; }
  .btn.sub { background: var(--soft); color: var(--text); }
  .btn.ok { background: var(--ok-bg); color: var(--ok); } .btn.ng { background: var(--err-bg); color: var(--err); }
  .btn.small { flex: none; padding: 7px 10px; font-size: .78rem; }
  .feedback { display: none; margin-top: 12px; padding: 13px; border-radius: 12px; background: var(--soft); font-size: .88rem; line-height: 1.55; }
  .feedback.show { display: block; }
  .feedback .ans { font-weight: 700; color: var(--primary); font-size: .96rem; margin-bottom: 6px; }
  .grade { margin-top: 10px; }
  .result { font-size: .78rem; font-weight: 700; float: right; }
  .result.ok { color: var(--ok); } .result.ng { color: var(--err); }

  .list-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: .9rem; line-height: 1.5; }
  .list-row:last-child { border-bottom: none; }
  .list-row .sub { font-size: .83rem; color: var(--subtext); }
  .list-row input[type=checkbox] { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--primary); flex: none; }
  .w { color: var(--err); font-size: .83rem; } .r { color: var(--ok); font-size: .83rem; }
  .grow { flex: 1; min-width: 0; }
  .empty { color: var(--subtext); font-size: .85rem; }
  .muted { color: var(--subtext); font-size: .8rem; line-height: 1.5; }
  h3 { font-size: .95rem; margin-bottom: 8px; }

  .toast { position: fixed; top: calc(env(safe-area-inset-top) + 76px); left: 50%; transform: translateX(-50%); background: #1E293B; color: #fff; padding: 10px 18px; border-radius: 30px; font-size: .85rem; font-weight: 600; display: none; z-index: 100; max-width: 90vw; text-align: center; }
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<header>
  <div><h1>영어 뼈대 코치</h1><p id="subtitle">1~5형식 · 10분 실전 훈련</p></div>
  <button class="hbtn" onclick="copyAnswers()">📋 답안 복사</button>
</header>

<div class="container">
  <div class="section active" id="sec-train">
    <div class="chips" id="setChips"></div>
    <div class="progress" id="progress"></div>
    <div id="questions"></div>
    <div class="row" style="margin-bottom:12px"><button class="btn sub" onclick="resetSet()">이 세트 답안 지우고 다시 풀기</button></div>
  </div>

  <div class="section" id="sec-cheat">
    <div class="card"><span class="badge">미국식 1~5형식 핵심 요약</span><div id="cheat"></div></div>
  </div>

  <div class="section" id="sec-notes">
    <div class="card"><span class="badge err">내가 틀린 문제 (자동 수집)</span><div id="myWrong"></div></div>
    <div class="card"><span class="badge warn">누적 오답 포인트</span><div id="mistakes"></div></div>
    <div class="card"><span class="badge">4주 학습 로드맵</span><div id="roadmap"></div></div>
  </div>

  <div class="section" id="sec-manage">
    <div class="card">
      <h3>➕ 새 문제 추가</h3>
      <p class="muted" style="margin-bottom:10px">① 아래 버튼으로 문제 생성 프롬프트를 복사해서 Claude나 Gemini에 붙여넣으세요. ② AI가 준 JSON을 여기에 붙여넣고 [추가]를 누르면 끝이에요.</p>
      <div class="row" style="margin-bottom:10px"><button class="btn sub" onclick="copyPrompt()">📋 문제 생성 프롬프트 복사</button></div>
      <textarea id="importBox" placeholder='{"title":"...", "questions":[...]}'></textarea>
      <div class="row"><button class="btn" onclick="importSet()">추가</button></div>
    </div>
    <div class="card"><h3>📚 내가 추가한 세트</h3><div id="extraSets"></div></div>
    <div class="card">
      <h3>💾 백업 / 복원</h3>
      <p class="muted" style="margin-bottom:10px">답안, 채점 기록, 추가한 문제는 이 기기에만 저장돼요. 가끔 백업을 복사해서 메모 앱 등에 보관해 두세요.</p>
      <div class="row" style="margin-bottom:10px"><button class="btn sub" onclick="copyBackup()">백업 복사</button></div>
      <textarea id="restoreBox" placeholder="백업 내용을 붙여넣고 [복원]"></textarea>
      <div class="row"><button class="btn sub" onclick="restore()">복원</button></div>
    </div>
    <p class="muted" style="text-align:center;margin:6px 0 14px" id="ver"></p>
  </div>
</div>

<nav class="bottom-nav">
  <button class="nav-item active" data-sec="sec-train"><span class="nav-icon">✍️</span>훈련</button>
  <button class="nav-item" data-sec="sec-cheat"><span class="nav-icon">📐</span>1~5형식</button>
  <button class="nav-item" data-sec="sec-notes"><span class="nav-icon">📓</span>오답·진도</button>
  <button class="nav-item" data-sec="sec-manage"><span class="nav-icon">⚙️</span>관리</button>
</nav>

<script>
const APP_VERSION = '1.0.0';
const KEY = 'coach_v1';
let content = { sets: [], cheatsheet: [], mistakes: [], roadmap: [] };
let st = load();

function load() {
  try { return Object.assign({ answers: {}, results: {}, roadmap: {}, extraSets: [], currentSet: null }, JSON.parse(localStorage.getItem(KEY) || '{}')); }
  catch (e) { return { answers: {}, results: {}, roadmap: {}, extraSets: [], currentSet: null }; }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { toast('저장 실패: 저장 공간을 확인하세요'); } }
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const allSets = () => content.sets.concat(st.extraSets);
const currentSet = () => allSets().find(s => s.id === st.currentSet) || allSets()[0];
const qkey = (set, q) => set.id + ':' + q.id;

function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 2500); }
async function copyText(text, msg) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast(msg);
}

/* ---------- 훈련 ---------- */
function renderTrain() {
  const sets = allSets(), cur = currentSet();
  $('setChips').innerHTML = sets.map(s => `<button class="chip ${s === cur ? 'active' : ''}" data-set="${esc(s.id)}">${esc(s.title)}</button>`).join('');
  if (!cur) { $('questions').innerHTML = '<div class="card empty">문제가 없어요. [관리] 탭에서 추가해 주세요.</div>'; return; }
  $('questions').innerHTML = cur.questions.map((q, i) => {
    const k = qkey(cur, q), r = st.results[k];
    return `<div class="card" data-k="${esc(k)}">
      ${r ? `<span class="result ${r}">${r === 'ok' ? '⭕ 맞음' : '❌ 틀림'}</span>` : ''}
      <span class="badge ${esc(q.level || '')}">Q${i + 1}${q.tag ? ' · ' + esc(q.tag) : ''}</span>
      <div class="q-title">"${esc(q.ko)}"</div>
      ${q.hint ? `<div class="q-hint">힌트: ${esc(q.hint)}</div>` : ''}
      ${q.bone ? `<div class="bone">💡 <b>뼈대 공식:</b> ${esc(q.bone)}</div>` : ''}
      <input type="text" data-input="${esc(k)}" value="${esc(st.answers[k] || '')}" placeholder="영어로 직접 입력해 보세요" autocapitalize="sentences" autocomplete="off" spellcheck="false">
      <div class="row"><button class="btn" data-toggle="${esc(k)}">모범 답안 & 해설</button></div>
      <div class="feedback" id="fb-${esc(k)}">
        <div class="ans">✅ ${esc(q.answer)}</div>
        <div>${q.explain || ''}</div>
        <div class="row grade"><button class="btn ok" data-grade="ok" data-k="${esc(k)}">⭕ 맞았어</button><button class="btn ng" data-grade="ng" data-k="${esc(k)}">❌ 틀렸어</button></div>
      </div></div>`;
  }).join('');
  renderProgress();
}
function renderProgress() {
  const cur = currentSet(); if (!cur) return;
  const n = cur.questions.length, keys = cur.questions.map(q => qkey(cur, q));
  const done = keys.filter(k => st.results[k]).length, ok = keys.filter(k => st.results[k] === 'ok').length;
  $('progress').textContent = `${n}문제 중 ${done}개 채점 · 맞음 ${ok}개`;
}
$('setChips').addEventListener('click', e => { const b = e.target.closest('[data-set]'); if (!b) return; st.currentSet = b.dataset.set; save(); renderTrain(); window.scrollTo(0, 0); });
$('questions').addEventListener('input', e => { const k = e.target.dataset.input; if (k) { st.answers[k] = e.target.value; save(); } });
$('questions').addEventListener('click', e => {
  const t = e.target.closest('[data-toggle]');
  if (t) { $('fb-' + t.dataset.toggle).classList.toggle('show'); return; }
  const g = e.target.closest('[data-grade]');
  if (g) {
    st.results[g.dataset.k] = g.dataset.grade; save();
    const card = g.closest('.card'); let tag = card.querySelector('.result');
    if (!tag) { tag = document.createElement('span'); card.prepend(tag); }
    tag.className = 'result ' + g.dataset.grade; tag.textContent = g.dataset.grade === 'ok' ? '⭕ 맞음' : '❌ 틀림';
    renderProgress(); renderWrong();
    toast(g.dataset.grade === 'ok' ? '좋아요! 👍' : '오답노트에 담았어요');
  }
});
function resetSet() {
  const cur = currentSet(); if (!cur || !confirm('이 세트의 답안과 채점 기록을 지울까요? (오답노트에서도 빠져요)')) return;
  cur.questions.forEach(q => { const k = qkey(cur, q); delete st.answers[k]; delete st.results[k]; });
  save(); renderTrain(); renderWrong();
}
function copyAnswers() {
  const cur = currentSet(); if (!cur) return;
  let text = `[영작 답안 제출] ${cur.title}\n`, any = false;
  cur.questions.forEach((q, i) => {
    const a = (st.answers[qkey(cur, q)] || '').trim();
    if (a) { any = true; text += `\nQ${i + 1}. ${q.ko}\n내 답: ${a}\n`; }
  });
  if (!any) text += '(아직 입력된 답안이 없습니다)';
  else text += '\n위 답안을 채점하고, 틀린 부분은 이유와 함께 고쳐줘.';
  copyText(text, '답안이 복사됐어요! AI 채팅창에 붙여넣어 주세요.');
}

/* ---------- 1~5형식 / 오답 / 진도 ---------- */
function renderStatic() {
  $('cheat').innerHTML = content.cheatsheet.map(c => `<div class="list-row"><div class="grow"><b>${esc(c.title)}</b><br><span class="sub">${c.body}</span></div></div>`).join('');
  $('mistakes').innerHTML = content.mistakes.map((m, i) => `<div class="list-row"><div class="grow"><b>${i + 1}. ${esc(m.title)}</b><br><span class="w">❌ ${esc(m.wrong)}</span> → <span class="r">⭕ ${esc(m.right)}</span></div></div>`).join('');
  $('roadmap').innerHTML = content.roadmap.map(w => `<label class="list-row"><input type="checkbox" data-week="${esc(w.id)}" ${st.roadmap[w.id] ? 'checked' : ''}><div class="grow"><b>${esc(w.title)}</b><br><span class="sub">${esc(w.desc)}</span></div></label>`).join('');
}
$('roadmap').addEventListener('change', e => { const w = e.target.dataset.week; if (w) { st.roadmap[w] = e.target.checked; save(); } });
function renderWrong() {
  const rows = [];
  allSets().forEach(s => s.questions.forEach(q => {
    const k = qkey(s, q);
    if (st.results[k] === 'ng') rows.push(`<div class="list-row"><div class="grow"><b>${esc(q.ko)}</b><br>
      <span class="w">❌ ${esc(st.answers[k] || '(답 없음)')}</span><br><span class="r">⭕ ${esc(q.answer)}</span><br><span class="sub">${esc(s.title)}${q.tag ? ' · ' + esc(q.tag) : ''}</span></div>
      <button class="btn sub small" data-clear="${esc(k)}">해결</button></div>`);
  }));
  $('myWrong').innerHTML = rows.length ? rows.join('') : '<p class="empty">아직 없어요. 훈련에서 정답을 확인한 뒤 [❌ 틀렸어]를 누르면 여기에 모여요.</p>';
}
$('myWrong').addEventListener('click', e => { const b = e.target.closest('[data-clear]'); if (b) { delete st.results[b.dataset.clear]; save(); renderWrong(); renderTrain(); } });

/* ---------- 관리 ---------- */
const PROMPT = `너는 한국인 학습자를 위한 영어 문법 코치야. 아래 JSON 형식 그대로, 다른 설명 없이 JSON만 출력해 줘.
주제: [여기에 원하는 주제. 예: 5형식 가목적어 it, 시제 일치, 전치사 to vs for]
문제 수: 6개

{
  "title": "세트 이름 (짧게)",
  "questions": [
    {
      "tag": "문법 포인트 이름",
      "level": "",            // "" 보통, "warn" 주의, "err" 내 취약점
      "ko": "영작할 한국어 문장",
      "hint": "단어 힌트",
      "bone": "뼈대 공식 (예: 주어 + makes it [형용사] + to 동사)",
      "answer": "모범 영어 답안",
      "explain": "해설 (강조는 <b>굵게</b>, 줄바꿈은 <br>)"
    }
  ]
}

(주석 // 부분은 출력에서 빼 줘)`;
function copyPrompt() { copyText(PROMPT, '프롬프트를 복사했어요. 주제만 바꿔서 쓰세요!'); }
function extractJson(raw) {
  raw = raw.trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
  const a = raw.search(/[\[{]/); if (a < 0) throw new Error('JSON이 없어요');
  return JSON.parse(raw.slice(a, Math.max(raw.lastIndexOf('}'), raw.lastIndexOf(']')) + 1));
}
function normalizeSet(obj) {
  if (Array.isArray(obj)) obj = { questions: obj };
  if (!obj || !Array.isArray(obj.questions) || !obj.questions.length) throw new Error('questions 목록이 비어 있어요');
  const id = 'x' + Date.now().toString(36);
  return {
    id, title: String(obj.title || '추가 세트 ' + new Date().toLocaleDateString('ko-KR')),
    questions: obj.questions.map((q, i) => {
      if (!q.ko || !q.answer) throw new Error(`${i + 1}번 문제에 ko 또는 answer가 없어요`);
      return { id: 'q' + (i + 1), tag: q.tag || '', level: ['warn', 'err', 'ok'].includes(q.level) ? q.level : '', ko: String(q.ko), hint: q.hint || '', bone: q.bone || '', answer: String(q.answer), explain: String(q.explain || '') };
    })
  };
}
function importSet() {
  try {
    const parsed = extractJson($('importBox').value);
    const list = parsed && Array.isArray(parsed.sets) ? parsed.sets : [parsed];
    const added = list.map(normalizeSet);
    added.forEach((s, i) => { s.id += i; st.extraSets.push(s); });
    st.currentSet = added[0].id; save();
    $('importBox').value = ''; renderAll(); showTab('sec-train');
    toast(`${added.reduce((n, s) => n + s.questions.length, 0)}문제를 추가했어요!`);
  } catch (e) { toast('추가 실패: ' + e.message); }
}
function renderExtra() {
  $('extraSets').innerHTML = st.extraSets.length ? st.extraSets.map(s => `<div class="list-row"><div class="grow"><b>${esc(s.title)}</b><br><span class="sub">${s.questions.length}문제</span></div><button class="btn sub small" data-del="${esc(s.id)}">삭제</button></div>`).join('') : '<p class="empty">아직 없어요.</p>';
}
$('extraSets').addEventListener('click', e => {
  const b = e.target.closest('[data-del]'); if (!b || !confirm('이 세트를 삭제할까요?')) return;
  st.extraSets = st.extraSets.filter(s => s.id !== b.dataset.del); save(); renderAll();
});
function copyBackup() { copyText(JSON.stringify({ app: 'english-coach', savedAt: new Date().toISOString(), data: st }), '백업을 복사했어요. 메모 앱에 붙여넣어 보관하세요.'); }
function restore() {
  try {
    const b = extractJson($('restoreBox').value); const data = b.data || b;
    if (!data.answers) throw new Error('백업 형식이 아니에요');
    if (!confirm('지금 기록을 백업 내용으로 바꿀까요?')) return;
    localStorage.setItem(KEY, JSON.stringify(data)); st = load(); $('restoreBox').value = ''; renderAll(); toast('복원했어요!');
  } catch (e) { toast('복원 실패: ' + e.message); }
}

/* ---------- 탭 / 시작 ---------- */
function showTab(id) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.sec === id));
  document.querySelectorAll('.section').forEach(s => s.classList.toggle('active', s.id === id));
  window.scrollTo(0, 0);
}
document.querySelector('.bottom-nav').addEventListener('click', e => { const b = e.target.closest('[data-sec]'); if (b) showTab(b.dataset.sec); });
function renderAll() { renderTrain(); renderStatic(); renderWrong(); renderExtra(); }

$('ver').textContent = 'v' + APP_VERSION;
fetch('content.json', { cache: 'no-cache' }).then(r => r.json()).then(c => { content = c; renderAll(); })
  .catch(() => { $('questions').innerHTML = '<div class="card empty">문제 파일을 불러오지 못했어요. 인터넷 연결 후 다시 열어 주세요.</div>'; });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
</script>
